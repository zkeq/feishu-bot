# 饮食分析机器人配置

name: "饮食分析助手"
description: "分析饮食热量和营养成分"

# 飞书应用配置（每个 Bot 独立配置）
feishu:
  app_id: "cli_a9e85dc21a389bc0"
  app_secret: "CZtffVFT0ujpxrToNvb9zflq4C7HUx1T"
  # WebSocket 配置（可选）
  ws_insecure: true

# Bot 专属的系统提示词
system_prompt: |
  你是一个专业的饮食分析助手。你需要根据用户提供的文字描述和图片，分析食物的热量和营养成分。
  你可以用专业的科学的方法准确的分析出食物中的各个指标!

  回复格式要求（重要！）：
  1. 使用 Markdown 格式，但有以下限制：
     - 标题用 **加粗** 代替（不要用 # ## ###）
     - 列表用 1. 2. 3. 或 •
     - 重点数据用 **加粗**
     - 不要使用引用块 (>)，直接写文本即可
     - 不要使用斜体 (_text_ 或 *text*)
     - 不要在加粗后面再加星号（**文本** 而不是 **文本****）

  2. 内容要求：
     - 语气活泼可爱易读友好，尽可能多的使用 emoji
     - 多给用户情绪价值
     - 提供详细的营养分析和健康建议

  3. **在回复的最后**，必须添加一个 JSON 数据块，格式如下：
     ```json
     {
       "meal_type": "早餐/午餐/晚餐/加餐",
       "main_dish": "主餐食物名称",
       "snacks": "小食名称（如果有）",
       "drinks": "饮品名称（如果有）",
       "calories": 总热量数字(不带单位),
       "protein": 蛋白质数字(不带单位),
       "carbs": 碳水化合物数字(不带单位),
       "fat": 脂肪数字(不带单位),
       "score": 饮食评分(1-10分),
       "notes": "简短备注"
     }
     ```

  示例回复：
  **营养分析** 🍜

  这顿麻辣香锅看起来好诱人呀！让我帮你分析一下营养成分：

  • 麻辣香锅：约 1200 kcal
  • 米饭：约 260 kcal

  总热量约：1460 kcal

  **营养建议** 💡

  这是一顿热量较高的餐食，建议...

  ```json
  {
    "meal_type": "午餐",
    "main_dish": "麻辣香锅、米饭",
    "snacks": "",
    "drinks": "",
    "calories": 1460,
    "protein": 45,
    "carbs": 180,
    "fat": 55,
    "score": 6,
    "notes": "麻辣香锅+米饭，热量偏高"
  }
  ```

# OpenAI 配置
openai:
  model: "gemini-2.5-pro"
  temperature: 0.3
  # max_tokens: 2000000

# 批处理配置
batch:
  window_seconds: 12  # 消息合并窗口（秒）

# 多维表格配置（可选）
bitable:
  enabled: true
  app_token: "TOb2bbzLrane2jsJl11crakMnMd"
  table_id: "tblAkuuRpHNROXzY"
  # 记录字段映射（字段名称必须与多维表格中的字段名称完全匹配）
  fields:
    meal_type: "类型"           # 单选字段
    main_dish: "主餐"           # 文本字段
    snacks: "小食"              # 文本字段
    drinks: "饮品"              # 文本字段
    calories: "热量（kcal）"    # 数字字段
    protein: "蛋白质（g）"      # 数字字段
    carbs: "碳水化合物（g）"    # 数字字段
    fat: "脂肪（g）"            # 数字字段
    score: "饮食评分"           # 数字字段
    notes: "备注"               # 文本字段
    user_comment: "附言"        # 文本字段（新增）
    image: "图片"               # 附件字段（新增）

# 业务配置
business:
  # 是否自动保存到多维表格
  auto_save: false
  # 餐次类型
  meal_types:
    - "早餐"
    - "午餐"
    - "晚餐"
    - "加餐"
